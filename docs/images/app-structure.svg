<svg xmlns="http://www.w3.org/2000/svg" width="1128" height="412" viewBox="0 0 1128 412" role="img" aria-labelledby="title description">
  <title id="title">How App.cpp calls the exercise code</title>
  <desc id="description">On the UI thread, a control change or preset load runs publishAppState in App.cpp, which calls prepareForSampleRate in ProcessorSetup.cpp and prepareState in AudioProcessor.cpp, using Gain.cpp to convert decibels; version 1 presets pass through LegacyMapping.cpp. The prepared settings are published through the shared state exchange. On the audio thread, getNextAudioBlock in App.cpp reads them with consumeLatest from the state exchange, generates the virtual sources, applies gain and EQ in AudioProcessor.cpp, mixes with mixOutput in Routing.cpp, applies output gain and mute, and copies to the device with copyOutputBlock in OutputBuffer.cpp. When recording, RecordingMeter.cpp measures the capture. Red dots mark the scope's Input, Post gain, Post EQ, Post mix and Output taps.</desc>
